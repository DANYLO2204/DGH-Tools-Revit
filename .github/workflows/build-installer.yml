name: Build DGH Tools Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'installer/DghToolsInstaller.cs'
      - 'installer/AssemblyInfo.cs'
      - 'installer/GenerateInstallerIcon.ps1'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate DGH Tools icon
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "installer\GenerateInstallerIcon.ps1"
          if (-not (Test-Path "installer\DGH_Tools.ico")) { throw "Installer icon was not generated" }

      - name: Patch plugin compiler WPF references
        shell: powershell
        run: |
          $path = "installer\DghToolsInstaller.cs"
          $src = Get-Content $path -Raw

          $old1 = @'
                string presentationCore = FindFrameworkDll("PresentationCore.dll");
                string windowsBase = FindFrameworkDll("WindowsBase.dll");
                string webExtensions = FindFrameworkDll("System.Web.Extensions.dll");
                if (csc == null || presentationCore == null || windowsBase == null || webExtensions == null)
                    throw new InvalidOperationException("Required .NET Framework 4.x compiler/reference files are missing.");

                string newDll = Path.Combine(temp, "GridEndAligner.dll");
                string arguments = BuildCompilerArguments(newDll, revitApi, revitApiUi, presentationCore, windowsBase, webExtensions, sourceFiles);
'@

          $new1 = @'
                string presentationCore = FindFrameworkDll("PresentationCore.dll");
                string presentationFramework = FindFrameworkDll("PresentationFramework.dll");
                string windowsBase = FindFrameworkDll("WindowsBase.dll");
                string systemXaml = FindFrameworkDll("System.Xaml.dll");
                string webExtensions = FindFrameworkDll("System.Web.Extensions.dll");
                if (csc == null || presentationCore == null || presentationFramework == null || windowsBase == null || systemXaml == null || webExtensions == null)
                    throw new InvalidOperationException("Required .NET Framework/WPF compiler reference files are missing.");

                string newDll = Path.Combine(temp, "GridEndAligner.dll");
                string arguments = BuildCompilerArguments(newDll, revitApi, revitApiUi, presentationCore, presentationFramework, windowsBase, systemXaml, webExtensions, sourceFiles);
'@

          $old2 = 'private string BuildCompilerArguments(string output, string revitApi, string revitApiUi, string presentationCore, string windowsBase, string webExtensions, List<string> sources)'
          $new2 = 'private string BuildCompilerArguments(string output, string revitApi, string revitApiUi, string presentationCore, string presentationFramework, string windowsBase, string systemXaml, string webExtensions, List<string> sources)'

          $old3 = @'
            b.Append("/reference:").Append(Quote(presentationCore)).Append(' ');
            b.Append("/reference:").Append(Quote(windowsBase)).Append(' ');
            b.Append("/reference:").Append(Quote(webExtensions)).Append(' ');
'@

          $new3 = @'
            b.Append("/reference:").Append(Quote(presentationCore)).Append(' ');
            b.Append("/reference:").Append(Quote(presentationFramework)).Append(' ');
            b.Append("/reference:").Append(Quote(windowsBase)).Append(' ');
            b.Append("/reference:").Append(Quote(systemXaml)).Append(' ');
            b.Append("/reference:").Append(Quote(webExtensions)).Append(' ');
'@

          if (-not $src.Contains($old1)) { throw "Installer source patch block 1 was not found" }
          if (-not $src.Contains($old2)) { throw "Installer source patch block 2 was not found" }
          if (-not $src.Contains($old3)) { throw "Installer source patch block 3 was not found" }

          $src = $src.Replace($old1, $new1)
          $src = $src.Replace($old2, $new2)
          $src = $src.Replace($old3, $new3)

          [IO.File]::WriteAllText($path, $src, (New-Object Text.UTF8Encoding($false)))
          Write-Host "Installer plugin compiler now references PresentationFramework.dll and System.Xaml.dll"

      - name: Build installer EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }
          & $csc /nologo /target:winexe /platform:x64 /optimize+ `
            /win32icon:"installer\DGH_Tools.ico" `
            /out:"dist\DGH_Tools_Revit2023_Setup.exe" `
            /reference:System.Windows.Forms.dll `
            /reference:System.Drawing.dll `
            /reference:System.Web.Extensions.dll `
            "installer\DghToolsInstaller.cs" `
            "installer\AssemblyInfo.cs"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

          $exe = Get-Item "dist\DGH_Tools_Revit2023_Setup.exe"
          $info = $exe.VersionInfo
          Write-Host "File:        $($exe.Name)"
          Write-Host "Size:        $($exe.Length)"
          Write-Host "Company:     $($info.CompanyName)"
          Write-Host "Product:     $($info.ProductName)"
          Write-Host "Description: $($info.FileDescription)"
          Write-Host "Version:     $($info.FileVersion)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DGH_Tools_Revit2023_Setup
          path: dist/DGH_Tools_Revit2023_Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish permanent installer in repository
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path installer\bin -Force | Out-Null
          Copy-Item "dist\DGH_Tools_Revit2023_Setup.exe" "installer\bin\DGH_Tools_Revit2023_Setup.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/bin/DGH_Tools_Revit2023_Setup.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update permanent GUI installer"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          } else {
            Write-Host "Installer binary is already current."
          }
