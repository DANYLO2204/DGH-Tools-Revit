name: Build DGH Tools Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'installer/DghToolsInstaller.cs'
      - 'installer/AssemblyInfo.cs'
      - 'installer/GenerateInstallerIcon.ps1'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate DGH Tools icon
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "installer\GenerateInstallerIcon.ps1"
          if (-not (Test-Path "installer\DGH_Tools.ico")) { throw "Installer icon was not generated" }

      - name: Build installer EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }
          & $csc /nologo /target:winexe /platform:x64 /optimize+ `
            /win32icon:"installer\DGH_Tools.ico" `
            /out:"dist\DGH_Tools_Revit2023_Setup.exe" `
            /reference:System.Windows.Forms.dll `
            /reference:System.Drawing.dll `
            /reference:System.Web.Extensions.dll `
            "installer\DghToolsInstaller.cs" `
            "installer\AssemblyInfo.cs"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

          $exe = Get-Item "dist\DGH_Tools_Revit2023_Setup.exe"
          $info = $exe.VersionInfo
          Write-Host "File:        $($exe.Name)"
          Write-Host "Size:        $($exe.Length)"
          Write-Host "Company:     $($info.CompanyName)"
          Write-Host "Product:     $($info.ProductName)"
          Write-Host "Description: $($info.FileDescription)"
          Write-Host "Version:     $($info.FileVersion)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DGH_Tools_Revit2023_Setup
          path: dist/DGH_Tools_Revit2023_Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish permanent installer in repository
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path installer\bin -Force | Out-Null
          Copy-Item "dist\DGH_Tools_Revit2023_Setup.exe" "installer\bin\DGH_Tools_Revit2023_Setup.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/bin/DGH_Tools_Revit2023_Setup.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update permanent GUI installer"
            git push
          } else {
            Write-Host "Installer binary is already current."
          }
