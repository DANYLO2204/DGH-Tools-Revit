name: Build DGH Tools Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'installer/**'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installer EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }
          & $csc /nologo /target:winexe /platform:x64 /optimize+ `
            /out:"dist\DGH_Tools_Revit2023_Setup.exe" `
            /reference:System.Windows.Forms.dll `
            /reference:System.Drawing.dll `
            /reference:System.Web.Extensions.dll `
            "installer\DghToolsInstaller.cs"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          Get-Item "dist\DGH_Tools_Revit2023_Setup.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DGH_Tools_Revit2023_Setup
          path: dist/DGH_Tools_Revit2023_Setup.exe
          if-no-files-found: error
          retention-days: 90
